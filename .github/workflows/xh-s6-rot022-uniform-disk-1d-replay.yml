name: XH-S6 ROT022 independent finite disk toy numeric replay
on:
  push:
    paths:
      - '.github/workflows/xh-s6-rot022-uniform-disk-1d-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  independent-analytic-disk-distance-pdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned mathematical runtime
        run: python -m pip install --disable-pip-version-check numpy==2.1.3
      - name: Independent synthetic thin-disk source-bounded math replay
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python research/xh-s6/2026-11-16/xh_s6_rot022_independent_uniform_disk_1d_yukawa_replay.py | tee /tmp/rot022-output.txt
          python - <<'PY'
          import re, pathlib
          lines=pathlib.Path('/tmp/rot022-output.txt').read_text().splitlines()
          observed=[line for line in lines if line.startswith('R=')]
          assert len(observed)==5, f'Expected five INDEPENDENT synthetic disk radii, got {len(observed)}'
          expected=[(0.02,.520071245,.440832018),(0.1,.523055870,.436862178),
                    (0.5,.567622546,.387093013),(1.0,.623847185,.350091354),
                    (2.0,.702940579,.328881644)]
          for got,(r,lam,val) in zip(observed,expected):
              match=re.match(r'R=([0-9.]+) mm lambda_opt=([0-9.]+) mm peak=([0-9.]+)',got)
              assert match,got
              a,b,c=map(float,match.groups())
              assert abs(a-r)<1e-12 and abs(b-lam)<2e-7 and abs(c-val)<2e-7,(got,r,lam,val)
          print('ROT022_1D_INDEPENDENT_REPLAY_PASS; SYNTHETIC_DISK_ONLY_NOT_EXPERIMENTAL')
          PY
      - name: Save bounded numeric source stdout
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xh-s6-rot022-independent-artificial-thin-disk-1d-replay
          path: /tmp/rot022-output.txt
          if-no-files-found: warn
          retention-days: 30
