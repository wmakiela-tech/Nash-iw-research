name: Mech-S6 Wu-Xu paper-law x charge-map comparator

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mech-s6-wuxu-paper-charge-2x2.yml"
      - "research/mech-s6/2026-10-19/apply_wuxu_paper_subedge_law.py"
      - "research/mech-s6/2026-10-18/wuxu_dynamic_comparator/**"

permissions:
  contents: read

jobs:
  paper-variants:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.3"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone audited Wu-Xu source
        run: |
          git clone https://github.com/Fenyutanchan/Primordial-Black-Hole.git _wuxu
          cd _wuxu
          git checkout d395183674cace6c9906a8911bdeb7234ba4040d

      - name: Freeze reduced Julia environment
        run: |
          julia research/mech-s6/2026-10-18/wuxu_dynamic_comparator/setup_env.jl "$GITHUB_WORKSPACE/.wuxu_env"

      - name: Apply paper M^-1.3 source law
        run: |
          python research/mech-s6/2026-10-19/apply_wuxu_paper_subedge_law.py             _wuxu/arXiv-2509.05618/tool_script-hadrons_from_PBH.jl             /tmp/tool_script-hadrons_from_PBH-paper.jl
          mv /tmp/tool_script-hadrons_from_PBH-paper.jl             _wuxu/arXiv-2509.05618/tool_script-hadrons_from_PBH.jl

      - name: Prepare B_exec and B_sym solver prefixes
        run: |
          cp _wuxu/arXiv-2509.05618/main-scan.jl /tmp/main-scan-paper-exec.jl
          python research/mech-s6/2026-10-17/apply_wuxu_charge_pair_source_map.py             /tmp/main-scan-paper-exec.jl /tmp/main-scan-paper-sym.jl
          python - <<'PY'
          from pathlib import Path
          marker = '@info "Loading ' + chr(96) + 'main-scan-parameters.jl' + chr(96) + '"'
          for label in ("paper-exec","paper-sym"):
              src=Path(f"/tmp/main-scan-{label}.jl").read_text()
              if marker not in src:
                  raise SystemExit("scan marker missing")
              prefix=src.split(marker,1)[0]
              out=Path("_wuxu/arXiv-2509.05618")/f"main-scan-{label}-prefix.jl"
              out.write_text(prefix)
          PY

      - name: Run paper-law B_exec diagnostic
        run: |
          julia --project="$GITHUB_WORKSPACE/.wuxu_env"             research/mech-s6/2026-10-18/wuxu_dynamic_comparator/run_one_point.jl             "$GITHUB_WORKSPACE/_wuxu/arXiv-2509.05618/main-scan-paper-exec-prefix.jl"             6e9 1e-16 paper_exec             "$GITHUB_WORKSPACE/research/mech-s6/2026-10-19/wuxu_paper_charge_2x2/results"

      - name: Run paper-law B_sym diagnostic
        run: |
          julia --project="$GITHUB_WORKSPACE/.wuxu_env"             research/mech-s6/2026-10-18/wuxu_dynamic_comparator/run_one_point.jl             "$GITHUB_WORKSPACE/_wuxu/arXiv-2509.05618/main-scan-paper-sym-prefix.jl"             6e9 1e-16 paper_sym             "$GITHUB_WORKSPACE/research/mech-s6/2026-10-19/wuxu_paper_charge_2x2/results"

      - name: Record paper-law contract
        run: |
          cat > research/mech-s6/2026-10-19/wuxu_paper_charge_2x2/results/contract.txt <<'EOF'
          Wu-Xu=d395183674cace6c9906a8911bdeb7234ba4040d
          NaturalUnits=4a9f007ff1df416c9fef28c4d83d8fe8846099cf
          Julia=1.12.3
          paper_subedge_edge_g=1e9
          paper_subedge_exponent=-1.3
          edge_normalization=species_specific_first_table_row
          above_edge=public_helper_unchanged
          diagnostic_mass_g=6e9
          diagnostic_beta=1e-16
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: mech-s6-wuxu-paper-charge-2x2-missing-cells
          path: research/mech-s6/2026-10-19/wuxu_paper_charge_2x2/results
