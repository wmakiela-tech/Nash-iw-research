name: Mech-S6 Wu-Xu charge-pair dynamic comparator

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mech-s6-wuxu-charge-comparator.yml"
      - "research/mech-s6/2026-10-18/wuxu_dynamic_comparator/**"

permissions:
  contents: write

jobs:
  comparator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.12.3"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Clone audited Wu-Xu source
        run: |
          git clone https://github.com/Fenyutanchan/Primordial-Black-Hole.git _wuxu
          cd _wuxu
          git checkout d395183674cace6c9906a8911bdeb7234ba4040d

      - name: Freeze reduced Julia environment
        run: |
          julia research/mech-s6/2026-10-18/wuxu_dynamic_comparator/setup_env.jl "$GITHUB_WORKSPACE/.wuxu_env"

      - name: Prepare current and repaired solver prefixes
        run: |
          cp _wuxu/arXiv-2509.05618/main-scan.jl /tmp/main-scan-current.jl
          python research/mech-s6/2026-10-17/apply_wuxu_charge_pair_source_map.py /tmp/main-scan-current.jl /tmp/main-scan-repaired.jl
          python - <<'PY'
          from pathlib import Path
          marker = '@info "Loading ' + chr(96) + 'main-scan-parameters.jl' + chr(96) + '"'
          for label in ("current","repaired"):
              src=Path(f"/tmp/main-scan-{label}.jl").read_text()
              if marker not in src:
                  raise SystemExit("scan marker missing")
              prefix=src.split(marker,1)[0]
              out=Path("_wuxu/arXiv-2509.05618")/f"main-scan-{label}-prefix.jl"
              out.write_text(prefix)
          PY

      - name: Run current source-map diagnostic
        run: |
          julia --project="$GITHUB_WORKSPACE/.wuxu_env" research/mech-s6/2026-10-18/wuxu_dynamic_comparator/run_one_point.jl "$GITHUB_WORKSPACE/_wuxu/arXiv-2509.05618/main-scan-current-prefix.jl" 6e9 1e-16 current "$GITHUB_WORKSPACE/research/mech-s6/2026-10-18/wuxu_dynamic_comparator/results"

      - name: Run repaired source-map diagnostic
        run: |
          julia --project="$GITHUB_WORKSPACE/.wuxu_env" research/mech-s6/2026-10-18/wuxu_dynamic_comparator/run_one_point.jl "$GITHUB_WORKSPACE/_wuxu/arXiv-2509.05618/main-scan-repaired-prefix.jl" 6e9 1e-16 repaired "$GITHUB_WORKSPACE/research/mech-s6/2026-10-18/wuxu_dynamic_comparator/results"

      - name: Compare trajectories
        run: |
          python research/mech-s6/2026-10-18/wuxu_dynamic_comparator/compare_runs.py research/mech-s6/2026-10-18/wuxu_dynamic_comparator/results

      - name: Record environment
        run: |
          echo "Wu-Xu=d395183674cace6c9906a8911bdeb7234ba4040d" > research/mech-s6/2026-10-18/wuxu_dynamic_comparator/results/environment.txt
          echo "NaturalUnits=4a9f007ff1df416c9fef28c4d83d8fe8846099cf" >> research/mech-s6/2026-10-18/wuxu_dynamic_comparator/results/environment.txt
          julia --version >> research/mech-s6/2026-10-18/wuxu_dynamic_comparator/results/environment.txt
          julia --project="$GITHUB_WORKSPACE/.wuxu_env" -e "using Pkg; Pkg.status()" >> research/mech-s6/2026-10-18/wuxu_dynamic_comparator/results/environment.txt

      - uses: actions/upload-artifact@v4
        with:
          name: mech-s6-wuxu-charge-pair-comparator
          path: research/mech-s6/2026-10-18/wuxu_dynamic_comparator/results

      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/mech-s6/2026-10-18/wuxu_dynamic_comparator/results
          if git diff --cached --quiet; then
            echo "No result changes."
          else
            git commit -m "research(mech-s6): record Wu-Xu charge-pair dynamic comparator"
            git push
          fi
