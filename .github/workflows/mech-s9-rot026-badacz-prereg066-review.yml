name: Mech-S9 ROT026 B1 authorized Badacz PREREG066 independent source referee

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/mech-s9-rot026-badacz-prereg066-review.yml'

permissions:
  contents: read

jobs:
  review066:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Source archive and owner SHA verification
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p mech_s9_rot026_evidence
          curl -L --fail --retry 3 --retry-all-errors --silent --show-error "https://raw.githubusercontent.com/Fenyutanchan/Primordial-Black-Hole/d395183674cace6c9906a8911bdeb7234ba4040d/arXiv-2509.05618/data/out/scanning.jld2" -o mech_s9_rot026_evidence/author_original_scanning.jld2
          echo '51844a46ca904f57f941e0d0ebc3b5920c38bace76eea9e1d89cb5fd1f2c5786  mech_s9_rot026_evidence/author_original_scanning.jld2' | sha256sum -c -
          echo 'db4261be59d9f796094c10e57761608b1c0247f98d925ee1294970eb10e96ae  research/badacz/2026-11-15/data/b1_066_raw_outputs.json' | sha256sum -c -
          echo 'b59a0a06bd3c13305bcb58e1676da0a5a780c5477d03cfc05928f8d1b236013c  research/badacz/2026-11-15/data/analysis066.json' | sha256sum -c -
          echo SOURCE_SHAS_PASS | tee mech_s9_rot026_evidence/STATUS.txt
      - name: Independent standard library source-based audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -I research/mech-s9/2026-11-16/code/mech_s9_rot026_badacz_prereg066_independent_referee_stdlib.py research/badacz/2026-11-15 mech_s9_rot026_evidence/author_original_scanning.jld2 mech_s9_rot026_evidence/ROT026_REFEREE.json > mech_s9_rot026_evidence/INDEPENDENT_STDOUT.txt
          cat mech_s9_rot026_evidence/INDEPENDENT_STDOUT.txt
          echo INDEPENDENT_70_DECIMAL_PASS | tee -a mech_s9_rot026_evidence/STATUS.txt
      - name: Original owner analysis byte-identical cold replay
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip -q install 'numpy==2.1.3'
          python3 - <<'PY'
          import pathlib,json,hashlib
          z=json.loads(pathlib.Path("research/badacz/2026-11-15/data/b1_066_raw_outputs.json").read_text())
          d=pathlib.Path("mech_s9_rot026_evidence/arm_data");d.mkdir()
          for name,v in z["arms"].items():
              data=("\n".join(v["jsonl_lines"])+"\n").encode()
              assert hashlib.sha256(data).hexdigest()==v["jsonl_sha256"],name
              (d/("arm_"+name+".jsonl")).write_bytes(data)
          print("NATIVE_ARM_JSONL_SHA_8_OF_8_PASS")
          PY
          python3 -I research/badacz/2026-11-15/code/b1_066_analysis.py mech_s9_rot026_evidence/arm_data mech_s9_rot026_evidence/author_original_scanning.jld2 mech_s9_rot026_evidence/OWNER_ANALYSIS066_COLD.json > mech_s9_rot026_evidence/OWNER_STDOUT.txt
          cmp research/badacz/2026-11-15/data/analysis066.json mech_s9_rot026_evidence/OWNER_ANALYSIS066_COLD.json
          echo OWNER_COLD_REPLAY_BIT_IDENTICAL_PASS | tee -a mech_s9_rot026_evidence/STATUS.txt
      - name: Original posthoc replay and tamper controls
        shell: bash
        run: |
          set -euo pipefail
          python3 -I research/badacz/2026-11-15/code/b1_066_posthoc.py research/badacz/2026-11-15 mech_s9_rot026_evidence/author_original_scanning.jld2 mech_s9_rot026_evidence/OWNER_POSTHOC066_COLD.json > mech_s9_rot026_evidence/POSTHOC_STDOUT.txt
          cmp research/badacz/2026-11-15/data/posthoc066.json mech_s9_rot026_evidence/OWNER_POSTHOC066_COLD.json
          python3 - <<'PY'
          import pathlib,subprocess,sys,shutil,tempfile
          original=pathlib.Path("mech_s9_rot026_evidence/author_original_scanning.jld2")
          source=pathlib.Path("research/mech-s9/2026-11-16/code/mech_s9_rot026_badacz_prereg066_independent_referee_stdlib.py")
          root=pathlib.Path("research/badacz/2026-11-15")
          with tempfile.TemporaryDirectory() as temp:
              temp=pathlib.Path(temp);copied=temp/"owner";shutil.copytree(root,copied)
              broken=copied/"data/b1_066_raw_outputs.json";v=broken.read_bytes()
              broken.write_bytes(v[:-1]+bytes([v[-1]^1]))
              out=temp/"forbidden.json"
              result=subprocess.run([sys.executable,"-I",str(source),str(copied),str(original),str(out)],capture_output=True)
              assert result.returncode!=0 and not out.exists()
              bad=temp/"bad.jld2";v=original.read_bytes()
              bad.write_bytes(v[:-1]+bytes([v[-1]^1]))
              result=subprocess.run([sys.executable,"-I",str(source),str(root),str(bad),str(out)],capture_output=True)
              assert result.returncode!=0 and not out.exists()
          print("TWO_INDEPENDENT_SOURCE_TAMPERS_REJECTED_PASS")
          PY
          echo OWNER_POSTHOC_BIT_IDENTICAL_AND_TAMPER_PASS | tee -a mech_s9_rot026_evidence/STATUS.txt
      - name: Retain only source fingerprints and derived evidence
        if: always()
        shell: bash
        run: |
          rm -rf mech_s9_rot026_evidence/arm_data
          rm -f mech_s9_rot026_evidence/author_original_scanning.jld2
          (cd mech_s9_rot026_evidence && find . -maxdepth 1 -type f ! -name RESULT_SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > RESULT_SHA256SUMS)
      - name: Upload audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mech-s9-rot026-badacz-prereg066-independent-referee
          path: mech_s9_rot026_evidence/
          if-no-files-found: error
