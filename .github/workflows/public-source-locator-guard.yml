name: Public source locator guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  newly-added-public-locators:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check newly added public provider coordinates
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/check_public_locators.py --base "$BASE_SHA" --head "$HEAD_SHA"
