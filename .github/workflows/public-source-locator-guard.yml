name: Public source locator guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  newly-added-public-locators:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # Same author-side gate runs before public push and as a PR status check.
      - name: Check public publication preflight (provider + metadata)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python scripts/prepublish_public_science.py --base "$BASE_SHA" --head "$HEAD_SHA"
      - name: Test author-side publication preflight
        run: python -m unittest discover -s tests -p test_prepublish_public_science.py -v
      - name: Test public scientific metadata preflight
        run: python -m unittest discover -s tests -p test_preflight_public_science_writeback.py -v
