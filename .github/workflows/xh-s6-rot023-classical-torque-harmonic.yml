name: XH-S6 ROT023 independent synthetic 16-fold torque harmonic replay
on:
  push:
    paths:
      - '.github/workflows/xh-s6-rot023-classical-torque-harmonic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bounded-classical-harmonic-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout public source host
        uses: actions/checkout@v4
      - name: Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install frozen numerical dependency
        run: python -m pip install --disable-pip-version-check numpy==2.3.5
      - name: Independently replay three PREDECLARED synthetic rotating-ring geometries
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python research/xh-s6/2026-11-16/xh_s6_rot023_synthetic_16fold_torsion_harmonic_independent_replay.py | tee /tmp/rot023_real_replay_stdout.json
          python - <<'PY'
          import json
          j=json.load(open('/tmp/rot023_real_replay_stdout.json'))
          assert j['ROT023_INDEPENDENT_NUMERIC_REPLAY']=='PASS'
          assert len(j['results'])==3
          assert j['NO_NASH_BRIDGE'] and not j['source_original_experiment_data_used']
          print('ROT023_SYNTHETIC_16FOLD_TORQUE_INDEPENDENT_PASS_NOT_EXPERIMENTAL')
          PY
      - name: Preserve synthetic numeric evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xh-s6-rot023-independent-artificial-classical-ring-harmonics
          path: /tmp/rot023_real_replay_stdout.json
          if-no-files-found: warn
          retention-days: 30
