name: XH-S6 ROT009 native noisy paired microstimulation source control
on:
  push:
    paths:
      - '.github/workflows/xh-s6-rot009-author-native-noisy-paired.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-noisy-paired:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout scientific host
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned NumPy
        run: python -m pip install --disable-pip-version-check numpy==2.1.3
      - name: Fetch frozen original author source and verify commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/solkm/formattingRNN.git /tmp/xh-s6-formattingRNN
          git -C /tmp/xh-s6-formattingRNN checkout --quiet --detach 7889a81e298c01532a313e02971c11dbc9db8eb0
          test "$(git -C /tmp/xh-s6-formattingRNN rev-parse HEAD)" = '7889a81e298c01532a313e02971c11dbc9db8eb0'
          mkdir -p /tmp/xh-s6-rot009-result
      - name: Execute source-native microstimulation paired original noise
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python research/xh-s6/2026-11-12/xh_s6_rot009_author_native_paired_noisy_microstim.py \
            --author-python-data-dir /tmp/xh-s6-formattingRNN/python_code_data \
            --output-dir /tmp/xh-s6-rot009-result \
            --seeds 12 | tee /tmp/xh-s6-rot009-result/runner_stdout.json
      - name: Preserve science output even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xh-s6-rot009-original-native-paired-noisy-12seeds
          path: /tmp/xh-s6-rot009-result/*
          if-no-files-found: warn
          retention-days: 30
