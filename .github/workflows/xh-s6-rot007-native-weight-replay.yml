name: XH-S6 ROT007 native original-weight Python cross-runtime control
on:
  push:
    paths:
      - '.github/workflows/xh-s6-rot007-native-weight-replay.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-weight-python:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out public scientific repository
        uses: actions/checkout@v4
      - name: Configure pinned Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install bounded NumPy dependency
        run: python -m pip install --disable-pip-version-check numpy==2.1.3
      - name: Fetch exact original author source and compare immutable identity
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/solkm/formattingRNN.git /tmp/xh-s6-formattingRNN
          git -C /tmp/xh-s6-formattingRNN checkout --quiet --detach 7889a81e298c01532a313e02971c11dbc9db8eb0
          test "$(git -C /tmp/xh-s6-formattingRNN rev-parse HEAD)" = '7889a81e298c01532a313e02971c11dbc9db8eb0'
          git -C /tmp/xh-s6-formattingRNN rev-parse HEAD:python_code_data/model_weights/MTbroadsharp_m10.npz
          git -C /tmp/xh-s6-formattingRNN rev-parse HEAD:python_code_data/model_weights/DLPFCcombined_m4.npz
          mkdir -p /tmp/xh-s6-reference
          curl --retry 2 --fail --location --silent --show-error https://raw.githubusercontent.com/wmakiela-tech/Nash-iw-research/f5e0d00624dc5b6996cb05c6816563dba3a05754/research/xh-s6/2026-11-12/xh_s6_rot006_original_weight_18x10_dots_onset_grid.csv -o /tmp/xh-s6-reference/dots.csv
          curl --retry 2 --fail --location --silent --show-error https://raw.githubusercontent.com/wmakiela-tech/Nash-iw-research/ebdd2ceec848076bc17656b558c0c44adb875b35/research/xh-s6/2026-11-12/xh_s6_rot006_original_weight_18x10_ring_onset_grid.csv -o /tmp/xh-s6-reference/ring.csv
      - name: Run bounded native NumPy 360-case source-weight comparison
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          mkdir -p /tmp/xh-s6-native-results
          python research/xh-s6/2026-11-12/xh_s6_rot007_native_npz_360_cross_runtime_replay.py \
            --weights-dir /tmp/xh-s6-formattingRNN/python_code_data/model_weights \
            --dots-csv /tmp/xh-s6-reference/dots.csv \
            --ring-csv /tmp/xh-s6-reference/ring.csv \
            --output-dir /tmp/xh-s6-native-results | tee /tmp/xh-s6-native-results/xh_s6_rot007_stdout.json
      - name: Preserve results even on scientific failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xh-s6-rot007-native-python-360-control
          path: /tmp/xh-s6-native-results/*
          if-no-files-found: warn
          retention-days: 30
