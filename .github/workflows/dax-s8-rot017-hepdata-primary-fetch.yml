name: DAX-S8 ROT017 primary Belle HEPData native source fetch
on:
  push:
    paths:
      - '.github/workflows/dax-s8-rot017-hepdata-primary-fetch.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  belle-original-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - name: Fetch bounded original HEPData Belle 2007 numeric payloads
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dax-s8-rot017
          python3 - <<'PY'
          import hashlib, json, pathlib, time, urllib.error, urllib.request, zipfile
          out=pathlib.Path('/tmp/dax-s8-rot017')
          base='https://www.hepdata.net'
          endpoints={
            'table1_csv':base+'/download/table/ins749358/Table%201/csv',
            'table2_csv':base+'/download/table/ins749358/Table%202/csv',
            'table71_csv':base+'/download/table/ins749358/Table%2071/csv',
            'submission_csv_zip':base+'/download/submission/ins749358/1/csv',
            'submission_yoda_zip':base+'/download/submission/ins749358/1/yoda',
            'record_json':base+'/record/ins749358?format=json'
          }
          receipt={'source':'Belle 2007 HEPData ins749358 DOI:10.17182/hepdata.51842.v1','requests':{},'has_original_numeric_bytes':False}
          for name,url in endpoints.items():
            item={'url':url,'status':'NOT_FETCHED'}
            try:
              req=urllib.request.Request(url,headers={'User-Agent':'NASH-DAX-S8-scientific-source-verification/1.0','Accept':'application/json,text/csv,application/zip,*/*'})
              with urllib.request.urlopen(req,timeout=22) as r:
                mime=r.headers.get('Content-Type','')
                buf=r.read(12000001)
                status=r.status
              item.update(http_status=status,content_type=mime,bytes=len(buf),sha256=hashlib.sha256(buf).hexdigest())
              if len(buf)>12000000: item['status']='REJECT_OVERSIZE'
              elif buf.lstrip().lower().startswith((b'<!doctype html',b'<html')): item['status']='REJECT_HTML_RESPONSE'
              elif status!=200: item['status']='REJECT_NON_200'
              else:
                ext='.zip' if buf.startswith(b'PK') else '.json' if 'json' in mime else '.csv' if 'csv' in mime else '.bin'
                path=out/(name+ext)
                path.write_bytes(buf)
                item.update(status='DOWNLOADED_ORIGINAL',stored_as=path.name)
                if name in ('table1_csv','table2_csv','table71_csv','submission_csv_zip','submission_yoda_zip'):
                  receipt['has_original_numeric_bytes']=True
                if ext=='.zip':
                  try:
                    with zipfile.ZipFile(path) as z:
                      members=z.namelist()
                      item['zip_member_count']=len(members)
                      item['zip_first_members']=members[:5]
                  except Exception as e:item['zip_verify_error']=repr(e)
                else:
                  item['first_text_lines']=buf[:300].decode('utf-8','replace').splitlines()[:4]
            except Exception as e:item.update(status='ACCESS_BLOCKED',error=repr(e))
            receipt['requests'][name]=item
            print('SOURCE_RECEIPT '+name+' '+json.dumps(item,ensure_ascii=True,sort_keys=True),flush=True)
          receipt['status']='ORIGINAL_SOURCE_BYTES_PRESENT' if receipt['has_original_numeric_bytes'] else 'ACCESS_BLOCKED_ALL_NUMERIC_SOURCE_PATHS'
          (out/'receipt.json').write_text(json.dumps(receipt,indent=2,sort_keys=True)+'\n')
          print('FINAL_RECEIPT '+json.dumps({'status':receipt['status'],'downloaded':[k for k,v in receipt['requests'].items() if v['status']=='DOWNLOADED_ORIGINAL']},sort_keys=True),flush=True)
          PY
      - name: Obtain independently packaged Rivet Belle reference with official RPM checksum
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/dax-s8-rot017
          expected='8bed5d37a841e90ffaf1af8fd6f28fc2823c38af87e884d2b78a99a378fc489b'
          got=0
          for url in \
            'https://download.opensuse.org/slowroll/repo/oss/noarch/Rivet-data-4.1.2-2.1.noarch.rpm' \
            'https://mirror.freedif.org/opensuse/tumbleweed/repo/oss/noarch/Rivet-data-4.1.2-2.1.noarch.rpm'; do
            echo "RIVET_RPM_ATTEMPT $url"
            if curl --fail --location --silent --show-error --max-time 135 --max-filesize 55000000 "$url" -o /tmp/dax-s8-rot017/rivet-source.rpm; then
              if echo "$expected  /tmp/dax-s8-rot017/rivet-source.rpm" | sha256sum --check -; then
                got=1
                break
              else
                echo 'RIVET_RPM_CHECKSUM_MISMATCH; rejecting bytes'
              fi
            fi
          done
          if [ "$got" -ne 1 ]; then
            echo 'RIVET_REFERENCE_SOURCE_ACCESS_BLOCKED_OR_SHA_MISMATCH'
            rm -f /tmp/dax-s8-rot017/rivet-source.rpm
          else
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends rpm2cpio cpio
            mkdir -p /tmp/dax-s8-rpm-extract
            cd /tmp/dax-s8-rpm-extract
            rpm2cpio /tmp/dax-s8-rot017/rivet-source.rpm | cpio --quiet -id './usr/share/Rivet/BELLE_2007_I749358.yoda.gz'
            if [ -f usr/share/Rivet/BELLE_2007_I749358.yoda.gz ]; then
              cp usr/share/Rivet/BELLE_2007_I749358.yoda.gz /tmp/dax-s8-rot017/BELLE_2007_I749358.yoda.gz
              python3 - <<'PY'
              import gzip,hashlib,json,pathlib,re
              p=pathlib.Path('/tmp/dax-s8-rot017/BELLE_2007_I749358.yoda.gz')
              raw=p.read_bytes()
              body=gzip.decompress(raw)
              head=body[:650].decode('utf8','replace')
              names=re.findall(r'(?m)^BEGIN YODA_\\w+\\s+(\\S+)',body.decode('utf8','replace'))
              out={'status':'RIVET_PACKAGED_REFERENCE_BYTES_READ','filename':p.name,'compressed_bytes':len(raw),'uncompressed_bytes':len(body),'sha256':hashlib.sha256(raw).hexdigest(),'objects':len(names),'first_objects':names[:8],'first_text':head}
              pathlib.Path('/tmp/dax-s8-rot017/rivet_reference_receipt.json').write_text(json.dumps(out,indent=2)+'\\n')
              print('RIVET_REFERENCE_RECEIPT '+json.dumps(out,sort_keys=True),flush=True)
              PY
            else
              echo 'RIVET_RPM_TARGET_YODA_NOT_FOUND_IN_PACKAGED_BYTES'
            fi
            rm -f /tmp/dax-s8-rot017/rivet-source.rpm
          fi
      - name: Save source bytes, hashes and typed access receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dax-s8-rot017-belle-hepdata-original-receipts
          path: /tmp/dax-s8-rot017/
          if-no-files-found: warn
          retention-days: 30
