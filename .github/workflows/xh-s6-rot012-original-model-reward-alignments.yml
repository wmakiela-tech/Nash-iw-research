name: XH-S6 ROT012 original-model reward alignment contexts
on:
  push:
    paths:
      - '.github/workflows/xh-s6-rot012-original-model-reward-alignments.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-source-native-reward-alignment:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout public scientific repo
        uses: actions/checkout@v4
      - name: Configure Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy 2.1.3
        run: python -m pip install --disable-pip-version-check numpy==2.1.3
      - name: Fetch author source frozen revision
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/solkm/formattingRNN.git /tmp/xh-s6-author-rot012
          git -C /tmp/xh-s6-author-rot012 checkout --quiet --detach 7889a81e298c01532a313e02971c11dbc9db8eb0
          test "$(git -C /tmp/xh-s6-author-rot012 rev-parse HEAD)" = 7889a81e298c01532a313e02971c11dbc9db8eb0
          mkdir -p /tmp/xh-s6-rot012-results
      - name: Execute original Task and PsychRNN source 4 reward contexts
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python research/xh-s6/2026-11-13/xh_s6_rot012_author_native_four_reward_alignments.py \
            --author-python-data-dir /tmp/xh-s6-author-rot012/python_code_data \
            --rot009-source research/xh-s6/2026-11-12/xh_s6_rot009_author_native_paired_noisy_microstim.py \
            --output-dir /tmp/xh-s6-rot012-results \
            --seed-blocks 24 | tee /tmp/xh-s6-rot012-results/actual_stdout.txt
      - name: Retain full observed model results on success or failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xh-s6-rot012-4-reward-context-original-source-24-blocks
          path: /tmp/xh-s6-rot012-results/*
          if-no-files-found: warn
          retention-days: 30
