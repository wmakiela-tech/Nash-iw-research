name: XH-S6 ROT019 original-source RNN stochastic shown direction comparison
on:
  push:
    paths:
      - '.github/workflows/xh-s6-rot019-native-random-scheduler-rnn.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  author-original-two-unit-random-direction-rnn:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout source host
        uses: actions/checkout@v4
      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numeric package
        run: python -m pip install --disable-pip-version-check numpy==2.1.3
      - name: Fetch original author source at exact immutable commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/solkm/formattingRNN.git /tmp/xh-s6-rot019-author
          git -C /tmp/xh-s6-rot019-author checkout --quiet --detach 7889a81e298c01532a313e02971c11dbc9db8eb0
          test "$(git -C /tmp/xh-s6-rot019-author rev-parse HEAD)" = 7889a81e298c01532a313e02971c11dbc9eb8eb0
          mkdir -p /tmp/xh-s6-rot019-actual-results
      - name: Run original frozen MT plus dlPFC RNN with source Task random shown directions
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python research/xh-s6/2026-11-13/xh_s6_rot019_original_author_random_direction_native_rnn.py \
            --original-source-dir /tmp/xh-s6-rot019-author/python_code_data \
            --rot009-source research/xh-s6/2026-11-12/xh_s6_rot009_author_native_paired_noisy_microstim.py \
            --rot013-source research/xh-s6/2026-11-13/xh_s6_rot013_source_native_all_ten_original_units_falsifier.py \
            --preregister research/xh-s6/2026-11-13/iw_xh_s6_rot019_randomized_direction_author_native_rnn_preregister_001.md \
            --out /tmp/xh-s6-rot019-actual-results | tee /tmp/xh-s6-rot019-actual-results/runner_stdout.txt
      - name: Preserve true scientific failures and all original model data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xh-s6-rot019-original-rnn-random-scheduler-250x72-two-units
          path: /tmp/xh-s6-rot019-actual-results/*
          if-no-files-found: warn
          retention-days: 30
