name: Mech-S10 ROT009 raw-source generator by BBN-model interaction signed I1
on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/mech-s10-rot009-source-only-model-generator-interaction-20261122.yml"
permissions:
  contents: read
concurrency:
  group: mech-s10-rot009-20261122-source-only
  cancel-in-progress: false
jobs:
  independent-64-source-roots-and-four-interaction-signs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check exact independent code and directly read raw Git sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p rot009
          test "$(git hash-object research/mech-s10/2026-11-22/code/mech_s10_rot009_generator_model_interaction_sign_referee.py)" = "db19a1f81a76fb77ef0c6253cfd7be2c6c43de2e"
          git rev-parse HEAD > rot009/GIT_REPO_COMMIT
          python3 -I research/mech-s10/2026-11-22/code/mech_s10_rot009_generator_model_interaction_sign_referee.py rot009/source_64roots_and_I.json > rot009/STDOUT 2> rot009/STDERR
          python3 -I -c 'import json; x=json.load(open("rot009/source_64roots_and_I.json")); assert x["n_root_total"]==64 and x["n_new_094_roots"]==48 and x["n_nominal_090_roots"]==16; assert x["n_cells_sign_flips_incl_nominal"]==4 and x["n_cells_sign_flips_fresh_only"]==3; assert x["max_source_root_vs_owner_094"]<=1e-12'
          test -s rot009/source_64roots_and_I.json
          echo "MECH_S10_ROT009_RAW_64_ROOTS_INTERACTION_SIGN_FALSIFIER_PASS" > rot009/VERDICT
      - name: SHA all data and logs even if source parsing failed
        if: always()
        shell: bash
        run: |
          mkdir -p rot009
          find rot009 -maxdepth 1 -type f ! -name ARTIFACT_SHA256SUMS -print0 | sort -z | xargs -0 -r sha256sum > rot009/ARTIFACT_SHA256SUMS
      - name: Preserve one source-only independent scientific result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mech-s10-rot009-source-only-model-generator-I-sign-results
          path: rot009/
          if-no-files-found: error
