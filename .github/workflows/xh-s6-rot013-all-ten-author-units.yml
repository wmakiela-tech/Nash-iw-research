name: XH-S6 ROT013 author native all 10 stimulation units
on:
  push:
    paths:
      - '.github/workflows/xh-s6-rot013-all-ten-author-units.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-author-ten-unit-falsifier:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout public scientific host
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned numerical package
        run: python -m pip install --disable-pip-version-check numpy==2.1.3
      - name: Fetch original source pinned commit
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/solkm/formattingRNN.git /tmp/xh-s6-rot013-author
          git -C /tmp/xh-s6-rot013-author checkout --quiet --detach 7889a81e298c01532a313e02971c11dbc9db8eb0
          test "$(git -C /tmp/xh-s6-rot013-author rev-parse HEAD)" = 7889a81e298c01532a313e02971c11dbc9db8eb0
          mkdir -p /tmp/xh-s6-rot013-results
      - name: Execute original Task and PsychRNN all ten source units
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python research/xh-s6/2026-11-13/xh_s6_rot013_source_native_all_ten_original_units_falsifier.py \
            --author-python-data-dir /tmp/xh-s6-rot013-author/python_code_data \
            --rot009-source research/xh-s6/2026-11-12/xh_s6_rot009_author_native_paired_noisy_microstim.py \
            --output-dir /tmp/xh-s6-rot013-results \
            --seed-blocks 16 | tee /tmp/xh-s6-rot013-results/actual_runner_stdout.txt
      - name: Retain all results regardless of scientific falsification status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xh-s6-rot013-native-ten-units-16seed-blocks
          path: /tmp/xh-s6-rot013-results/*
          if-no-files-found: warn
          retention-days: 30
