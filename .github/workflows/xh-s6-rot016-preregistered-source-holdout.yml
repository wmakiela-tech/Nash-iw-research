name: XH-S6 ROT016 preregistered new-seed original RNN holdout
on:
  push:
    paths:
      - '.github/workflows/xh-s6-rot016-preregistered-source-holdout.yml'
      - 'research/xh-s6/2026-11-13/xh_s6_rot016_preregistered_source_native_holdout.py'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  original-author-model-prospective-seeds:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout public scientific host
        uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned NumPy
        run: python -m pip install --disable-pip-version-check numpy==2.1.3
      - name: Fetch frozen original author code
        shell: bash
        run: |
          set -euo pipefail
          git clone --quiet https://github.com/solkm/formattingRNN.git /tmp/xh-s6-rot016-original
          git -C /tmp/xh-s6-rot016-original checkout --quiet --detach 7889a81e298c01532a313e02971c11dbc9db8eb0
          test "$(git -C /tmp/xh-s6-rot016-original rev-parse HEAD)" = 7889a81e298c01532a313e02971c11dbc9db8eb0
          mkdir -p /tmp/xh-s6-rot016-result
      - name: Run preregistered frozen gap on FRESH original-model stochastic seed streams
        shell: bash
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
        run: |
          set -euo pipefail
          python research/xh-s6/2026-11-13/xh_s6_rot016_preregistered_source_native_holdout.py \
            --original-source-dir /tmp/xh-s6-rot016-original/python_code_data \
            --rot009-source research/xh-s6/2026-11-12/xh_s6_rot009_author_native_paired_noisy_microstim.py \
            --rot013-source research/xh-s6/2026-11-13/xh_s6_rot013_source_native_all_ten_original_units_falsifier.py \
            --preregister research/xh-s6/2026-11-13/iw_xh_s6_rot016_prospective_holdout_gap_preregister_001.md \
            --amendment research/xh-s6/2026-11-13/iw_xh_s6_rot016_pre_data_seed_range_amendment_001.md \
            --out /tmp/xh-s6-rot016-result \
            --seed-blocks 24 | tee /tmp/xh-s6-rot016-result/runner_stdout.txt
      - name: Preserve both positive and falsifying source-output evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xh-s6-rot016-original-source-fresh-seed-holdout-24-blocks
          path: /tmp/xh-s6-rot016-result/*
          if-no-files-found: warn
          retention-days: 30
