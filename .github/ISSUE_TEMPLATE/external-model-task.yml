name: External model task
description: Public-safe bounded task for Grok or another external participant.
title: "[EXT-MODEL] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        This repository is public. Do not include private IW artifacts, credentials, restricted source material, unpublished private scientific conclusions, or private storage coordinates.
  - type: input
    id: target
    attributes:
      label: Target participant
      placeholder: Grok
    validations:
      required: true
  - type: dropdown
    id: task_type
    attributes:
      label: Task type
      options: [Technical audit, Refactor, Implementation critique, Repository architecture, Public prior-art check, Reproducibility check, Other]
    validations:
      required: true
  - type: textarea
    id: object
    attributes:
      label: Object and exact bounded question
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Allowed public sources / repository pointers
    validations:
      required: true
  - type: input
    id: currentness_basis
    attributes:
      label: Currentness basis / as of
      description: Public-safe commit, issue, source-family identity, or dated state assumed by this task.
      placeholder: commit SHA or source family, as of YYYY-MM-DD
    validations:
      required: true
  - type: textarea
    id: stale_if
    attributes:
      label: Invalidation rule / stale if
      value: |
        This task becomes stale if it is closed or superseded, the named basis changes, or the acceptance owner posts cancellation. A late return may be considered as independent evidence, not as fulfillment of this task.
    validations:
      required: true
  - type: input
    id: acceptance_owner
    attributes:
      label: Acceptance owner
      description: Public-safe role or cell authorized to accept the return; GitHub visibility alone is not acceptance.
      placeholder: IW_SYSCELL_SUCCESSOR_02 / SYSS3
    validations:
      required: true
  - type: textarea
    id: boundaries
    attributes:
      label: Boundaries and claim ceiling
      value: |
        public_safe_only: true
        scientific_adoption: false
        canon: false
        exec_sign: false
    validations:
      required: true
  - type: textarea
    id: stop
    attributes:
      label: Stop condition
    validations:
      required: true
  - type: textarea
    id: return_contract
    attributes:
      label: Return contract
      value: |
        Begin with task_id and FROM_CELL/participant. State what changed/found, evidence or diff, uncertainty/failure, currentness recheck, and recommended next action.
    validations:
      required: true
